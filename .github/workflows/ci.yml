name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-core-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build and runtime requirements
        run: python -m pip install --upgrade pip build -r requirements.txt
      - name: Run headless core and CLI tests
        run: >-
          python -m unittest
          test_app_paths test_auth_logging test_cli test_cli_phase3
          test_playlist_import test_playlist_import_workflow
          test_playlist_service test_royalshuffle_workflow
          test_session_service test_spotify_client
      - name: Verify full discovery handles unavailable GUI modules
        run: python -m unittest discover -v
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install and smoke-test the wheel outside the checkout
        shell: bash
        run: |
          python -m venv "${RUNNER_TEMP}/royalshuffle-smoke"
          "${RUNNER_TEMP}/royalshuffle-smoke/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          export XDG_CONFIG_HOME="${RUNNER_TEMP}/xdg-config"
          export XDG_STATE_HOME="${RUNNER_TEMP}/xdg-state"
          export XDG_DATA_HOME="${RUNNER_TEMP}/xdg-data"
          "${RUNNER_TEMP}/royalshuffle-smoke/bin/royalshuffle" --version
          "${RUNNER_TEMP}/royalshuffle-smoke/bin/royalshuffle" --help
          "${RUNNER_TEMP}/royalshuffle-smoke/bin/royalshuffle" diagnostics
          test ! -e "${XDG_CONFIG_HOME}/royalshuffle/token.json"
          "${RUNNER_TEMP}/royalshuffle-smoke/bin/python" -c "import cli, pathlib, sys; assert 'tkinter' not in sys.modules; assert pathlib.Path(cli.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve())"
          "${RUNNER_TEMP}/royalshuffle-smoke/bin/python" -m pip uninstall -y royalshuffle
          test ! -e "${RUNNER_TEMP}/royalshuffle-smoke/bin/royalshuffle"
          if "${RUNNER_TEMP}/royalshuffle-smoke/bin/python" -c "import cli" 2>/dev/null; then exit 1; fi

  windows-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full test suite
        run: python -m unittest discover -v
